[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rtt-io-api"
dynamic = ["version"]
description = "Python client for the Realtime Trains (data.rtt.io) API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "M. Murphy", email = "murphy.md@gmail.com" }]
keywords = ["realtimetrains", "rtt", "trains", "railway", "uk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "tzdata"]

[project.urls]
"API Specification" = "https://realtimetrains.github.io/api-specification/"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.version]
path = "src/rtt_io_api/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/rtt_io_api", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/rtt_io_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
